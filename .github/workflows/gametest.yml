name: GameTest

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gametest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run game tests
        run: ./gradlew runGameTestServer --no-daemon --stacktrace
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-log
          path: run/gametest/logs/
          if-no-files-found: ignore

  # 同版本外部 c2me 的开发环境兼容检查不替代最终 JarJar 产物验收。
  gametest-c2me:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install c2me
        run: ./gradlew prepareGameTestC2me --no-daemon --stacktrace
      - name: Run game tests with c2me
        run: ./gradlew runGameTestServer --no-daemon --stacktrace
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-c2me-log
          path: run/gametest/logs/
          if-no-files-found: ignore

  # 两个隔离批次各用独立 runner 和游戏进程，禁止合并命名空间。
  gametest-isolated:
    name: GameTest (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [expo, native]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run isolated game tests
        run: >-
          ./gradlew runGameTestServer
          -Pgametest_namespaces=dawnduskterminal${{ matrix.suite }}
          -Pgametest_directory=run/gametest-${{ matrix.suite }}
          --no-daemon --stacktrace
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-${{ matrix.suite }}-log
          path: run/gametest-${{ matrix.suite }}/logs/
          if-no-files-found: ignore

